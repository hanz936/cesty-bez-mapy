name: db-lint
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      # `supabase db start` čte config.toml (verze DB, sekce služeb).
      - 'supabase/config.toml'
      # Změna workflow se otestuje ve vlastním PR.
      - '.github/workflows/db-lint.yml'
jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bez `version` nainstaluje verzi balíčku `supabase` z package-lock.json
      # (README setup-cli v3) — CLI v CI se mění s lockfilem, ne s každým vydáním.
      - uses: supabase/setup-cli@v3
      # Jen Postgres s migracemi (CI návod Supabase); pgTAP sada nepotřebuje
      # auth/storage/edge kontejnery.
      - run: supabase db start
      - run: supabase test db
